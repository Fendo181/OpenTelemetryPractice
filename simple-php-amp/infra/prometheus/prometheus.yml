# Prometheus設定 - PHPerKaigi 2026デモ用
# OpenTelemetry Collectorからメトリクスをスクレイプ

global:
  scrape_interval: 15s      # 15秒ごとにメトリクス収集
  evaluation_interval: 15s  # ルール評価間隔

scrape_configs:
  # OpenTelemetry Collectorのメトリクスをスクレイプ
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'simple-php-apm'
          environment: 'phperkaigi-2026-demo'

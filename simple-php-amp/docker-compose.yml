version: '3.8'

services:
  # PHPアプリケーション - Todo APIサーバー
  php-app:
    build:
      context: ./php-app
      dockerfile: Dockerfile
    container_name: simple-php-app
    ports:
      - "8080:8080"
    volumes:
      - ./php-app:/app
      - ./php-app/database:/app/database
    environment:
      # OpenTelemetry設定
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: simple-php-apm
      OTEL_SERVICE_VERSION: 1.0.0
      # PHP設定
      PHP_MEMORY_LIMIT: 256M
    depends_on:
      - otel-collector
    networks:
      - apm-network
    command: php -S 0.0.0.0:8080 -t /app/public

  # OpenTelemetry Collector - テレメトリデータの集約・転送
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exporter
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - apm-network

  # Jaeger - 分散トレーシングUI
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - apm-network

  # Prometheus - メトリクス収集・保存
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - apm-network

  # Loki - ログ集約・保存
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - apm-network

  # Grafana - 可視化ダッシュボード
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks:
      - apm-network

networks:
  apm-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:

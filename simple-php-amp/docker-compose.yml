services:
  # PHPアプリケーション - Todo APIサーバー
  php-app:
    build:
      context: ./php-app
      dockerfile: Dockerfile
    container_name: simple-php-app
    ports:
      - "8080:8080"
    volumes:
      - ./php-app:/app
      - ./php-app/database:/app/database
    environment:
      # OpenTelemetry設定
      OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.nr-data.net:4318
      OTEL_EXPORTER_OTLP_HEADERS: "api-key=${NEW_RELIC_LICENSE_KEY}"
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: simple-php-apm
      # PHP設定
      PHP_MEMORY_LIMIT: 256M
    command: php -S 0.0.0.0:8080 -t /app/public
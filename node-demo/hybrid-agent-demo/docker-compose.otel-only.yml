# ============================================================
# docker-compose.otel-only.yml
# OtelOnly パターン: 純粋 OTel パターン（OTel SDK + OTLP 直送）
# 起動: docker compose -f docker-compose.otel-only.yml up --build
# ============================================================

name: otel-only

services:
  # メインアプリケーション（OTel SDK で計装）
  app-otel-only:
    build:
      context: ./otel-only
    # コンテナ内では "app" という名前で参照できるようにエイリアスを設定する
    # loadgen が http://app:3000 で接続できるようにするため
    networks:
      default:
        aliases:
          - app
    ports:
      - "3001:3000"
    environment:
      # New Relic へのデータ送信に必要なライセンスキー（.env から読み込む）
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY_OTEL_ONLY}
      # New Relic UI に表示されるサービス名
      - OTEL_SERVICE_NAME=demo-otel-only
      # パターン識別用ラベル（/ エンドポイントのレスポンスに含まれる）
      - PATTERN_LABEL=OtelOnly
      - NODE_ENV=production

  # 負荷生成コンテナ（全エンドポイントに定期リクエスト）
  loadgen:
    build:
      context: ./loadgen
    depends_on:
      - app-otel-only
    # loadgen は app-otel-only と同じネットワークに接続する
    networks:
      - default
    environment:
      - NODE_ENV=production

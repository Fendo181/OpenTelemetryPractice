global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # OpenTelemetry Collector が公開するメトリクス (自身の動作状況)
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  # PHP アプリが Collector 経由で送信したメトリクス
  - job_name: 'php-otel-demo'
    static_configs:
      - targets: ['otel-collector:8889']
